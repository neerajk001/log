# Single-package project (keeps install behavior unchanged).
#
# Build-script approvals (supply-chain gate) live here because recent pnpm
# versions ignore the "pnpm" field in package.json. The key name depends on
# the pnpm major, so BOTH are declared — each version reads its own and
# ignores the other:
#   - pnpm 10.x reads `onlyBuiltDependencies`
#   - pnpm 11.x (EAS cloud builders) reads `allowBuilds`
packages:
  - "."

onlyBuiltDependencies:
  - "@clerk/shared"
  - browser-tabs-lock
  - bufferutil
  - core-js
  - unrs-resolver
  - utf-8-validate

allowBuilds:
  "@clerk/shared": true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  unrs-resolver: true
  utf-8-validate: true
