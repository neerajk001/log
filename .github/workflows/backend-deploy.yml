name: backend-deploy

# CI + CD for log-app-backend only (Docker).
# Push to main (touching the backend or this workflow) runs tests/build,
# then SSHs into the VPS and redeploys the compose stack:
#   git pull -> compose build -> migrate -> compose up -> health check
# (see deployment.md). The VPS .env file is never touched by CI.

on:
  push:
    branches: [main]
    paths:
      - "log-app-backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: backend CI (install, typecheck/build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log-app-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: log-app-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Test (vitest)
        run: npm test
        env:
          # Unit tests must not need real secrets; dummy values keep
          # config loading from crashing if a test imports it.
          DATABASE_URL: postgresql://user:password@localhost:5432/log?sslmode=require
          CLERK_SECRET_KEY: sk_test_dummy_for_ci
          OPENAI_API_KEY: dummy_for_ci

  deploy:
    name: deploy to VPS over SSH
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            # VPS_APP_DIR is the repo root; the compose stack lives one level
            # deeper in log-app-backend/.
            cd ${{ secrets.VPS_APP_DIR }}
            echo "--- retire pm2 (one-time docker migration) ---"
            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete log-api || true
              pm2 delete param-api || true
            fi
            echo "--- git pull ---"
            git pull origin main
            cd log-app-backend
            echo "--- docker daemon check ---"
            docker info >/dev/null
            echo "--- build image ---"
            docker compose build
            echo "--- migrate ---"
            docker compose run --rm api npx prisma migrate deploy
            echo "--- start ---"
            docker compose up -d
            echo "--- health check ---"
            sleep 8
            docker compose ps
            PORT_VALUE="$(grep -E '^PORT=' .env | cut -d= -f2 | tr -d ' \r')"
            PORT_VALUE="${PORT_VALUE:-3000}"
            curl -fsS "http://localhost:${PORT_VALUE}/health"
            echo ""
            docker image prune -f
            echo "DEPLOY OK"
